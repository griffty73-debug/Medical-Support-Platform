services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: medical_treatment
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - medical_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical_treatment"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  medical_data:
